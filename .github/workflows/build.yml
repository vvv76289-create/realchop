name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare template (remove example code, set mod properties)
        run: |
          find src/main/java -name '*.java' -not -path '*/com/realchop/*' -delete
          find src/main/java -type d -empty -delete || true
          sed -i 's/^mod_id=.*/mod_id=realchop/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=RealChop/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.realchop/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=0.3.0/' gradle.properties
          grep -E '^(mod_|neo_version|minecraft_version)' gradle.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: realchop-jar
          path: build/libs/*.jar
